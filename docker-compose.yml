# Opcional: use apenas se você tiver Docker. Sem Docker, use o MariaDB local (XAMPP).
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: casamento
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  db_data:
