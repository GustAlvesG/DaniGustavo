<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>Sem conexão</title>
    <style>
      html {
        background: #faf7f1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        color: #1b2a4a;
        text-align: center;
      }
      main {
        max-width: 460px;
        padding: 40px 28px;
        background: #fff;
        box-shadow:
          inset 0 0 0 1px rgb(27 42 74 / 0.18),
          inset 0 0 0 8px #fff,
          inset 0 0 0 9px rgb(27 42 74 / 0.32),
          0 18px 40px -26px rgb(20 33 61 / 0.5);
      }
      img {
        width: 72px;
        height: 72px;
        display: block;
        margin: 0 auto 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-weight: 400;
        font-size: 2.2rem;
        line-height: 1.1;
      }
      h1 em {
        color: #2d4675;
      }
      p {
        margin: 0 0 22px;
        font-size: 1.2rem;
        line-height: 1.45;
        color: #46557a;
      }
      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #14213d;
        color: #fff;
        text-decoration: none;
        font:
          500 0.78rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      a:focus-visible {
        outline: 3px solid #2d4675;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/192" alt="" width="72" height="72" />
      <h1>Sem <em>conexão</em> agora</h1>
      <p>Não deu para carregar a página. Confira a internet e tente de novo.</p>
      <a
        href="/"
        onclick="
          location.reload();
          return false;
        "
        >Tentar de novo</a
      >
    </main>
  </body>
</html>
