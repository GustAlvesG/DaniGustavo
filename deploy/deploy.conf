# Lido pelo script `site` da VPS (contrato em CLAUDE.md, seção "Deploy: arquitetura da VPS").
SLUG="casamento" # = name: do docker-compose.prod.yml (não mude: os volumes dependem dele)
DOMAIN_VARS="DOMAIN API_DOMAIN PLATFORM_HOST LEGACY_API_DOMAIN"
REQUIRED_VARS="DOMAIN API_DOMAIN PLATFORM_HOST LEGACY_API_DOMAIN MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD WEB_KEY BETTER_AUTH_SECRET PAYMENT_SECRETS_KEY"
SECRET_VARS="MYSQL_PASSWORD MYSQL_ROOT_PASSWORD WEB_KEY BETTER_AUTH_SECRET PAYMENT_SECRETS_KEY"
HEALTH_URLS='https://${DOMAIN}/api/health https://${PLATFORM_HOST}/api/health https://${API_DOMAIN}/api/health https://${LEGACY_API_DOMAIN}/api/health'
BACKUP_CMD="scripts/backup-db.sh"
# PLATFORM_HOST e LEGACY_API_DOMAIN são obrigatórios: o site.caddy tem um bloco para cada.
# Fase 6 (opcionais, sem valor padrão obrigatório): BILLING_PROVIDER,
# PLATFORM_BASE_DOMAIN, SIGNUP_ENABLED, PLATFORM_ALERT_EMAIL, LOG_FORMAT.

primeira_vez() {
  docker compose run --rm setup
}

pos_subida() {
  docker compose run --rm migrate
}
