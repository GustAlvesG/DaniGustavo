# Lido pelo script `site` da VPS (contrato em CLAUDE.md, seção "Deploy: contrato da VPS ArtZan").
# Plataforma (branch saas) como projeto próprio, ao lado do projeto "casamento" (branch main).
SLUG="happy4ever" # = name: do docker-compose.prod.yml (não mude: os volumes dependem dele)
DOMAIN_VARS="DOMAIN API_DOMAIN"
REQUIRED_VARS="DOMAIN API_DOMAIN MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD WEB_KEY BETTER_AUTH_SECRET PAYMENT_SECRETS_KEY SETUP_WEDDING"
SECRET_VARS="MYSQL_PASSWORD MYSQL_ROOT_PASSWORD WEB_KEY BETTER_AUTH_SECRET PAYMENT_SECRETS_KEY"
HEALTH_URLS='https://${DOMAIN}/api/health https://${API_DOMAIN}/api/health'
BACKUP_CMD="scripts/backup-db.sh"
# DOMAIN é também o PLATFORM_HOST (o compose deriva; site da plataforma no próprio DOMAIN).
# SETUP_WEDDING=0 neste projeto: o setup cria só planos, contas e o admin da plataforma, sem
# importar o casamento (que segue no projeto "casamento" até migrar; docs/DEPLOY.md).
# Opcionais (Fase 6): BILLING_PROVIDER, PLATFORM_BASE_DOMAIN, SIGNUP_ENABLED,
# PLATFORM_ALERT_EMAIL, LOG_FORMAT.

primeira_vez() {
  docker compose run --rm migrate
  docker compose run --rm setup
}

pos_subida() {
  docker compose run --rm migrate
}
