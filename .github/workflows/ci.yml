name: CI

on:
  push:
  pull_request:
  # Manual (aba Actions → CI → Run workflow): marque "e2e" para rodar também o Playwright.
  workflow_dispatch:
    inputs:
      e2e:
        description: "Rodar os testes de ponta a ponta (Playwright)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valores fictícios só para o CI; nada aqui é segredo real. Pagamentos e assinaturas sempre no
# provedor simulado (nunca o Asaas), sem SMTP (e-mail vai para o log).
env:
  DATABASE_URL: mysql://root:@127.0.0.1:3306/casamento
  API_URL: http://localhost:3333
  SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  WEB_KEY: ci-web-key-ficticia-com-mais-de-32-caracteres
  BETTER_AUTH_SECRET: ci-better-auth-secret-ficticio-com-mais-de-32
  BETTER_AUTH_URL: http://localhost:3333
  ADMIN_EMAIL_1: dani@exemplo.com
  ADMIN_EMAIL_2: gustavo@exemplo.com
  ADMIN_PASSWORD_INICIAL: ci-senha-ficticia-123
  PAYMENT_PROVIDER: simulado
  BILLING_PROVIDER: simulado

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: casamento
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Migrations num banco vazio do MySQL 8 e a primeira carga de produção, duas vezes (o
      # setup tem de ser idempotente). O CLI próprio porque o drizzle-kit às vezes falha calado.
      - name: Migrations e setup
        run: |
          pnpm --filter @casamento/db exec node src/cli.ts migrate
          pnpm db:setup
          pnpm db:setup
      # Os testes criam, migram e semeiam os próprios bancos (casamento_api_test, casamento_test).
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: casamento
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @casamento/web exec playwright install --with-deps chromium
      - run: pnpm db:reset
      # O Playwright sobe a API (com o painel) e o `next dev` (webServer do playwright.config.ts).
      - run: pnpm --filter @casamento/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
