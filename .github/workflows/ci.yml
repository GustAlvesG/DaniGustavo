name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: casamento
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    # Valores fictícios só para o CI; nada aqui é segredo real.
    env:
      DATABASE_URL: mysql://root:@127.0.0.1:3306/casamento
      API_URL: http://localhost:3333
      WEB_KEY: ci-web-key-ficticia-com-mais-de-32-caracteres
      BETTER_AUTH_SECRET: ci-better-auth-secret-ficticio-com-mais-de-32
      BETTER_AUTH_URL: http://localhost:3333
      ADMIN_EMAIL_1: dani@exemplo.com
      ADMIN_EMAIL_2: gustavo@exemplo.com
      ADMIN_PASSWORD_INICIAL: ci-senha-ficticia-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Os testes criam, migram e semeiam os próprios bancos (casamento_api_test, casamento_test).
      - run: pnpm test
      - run: pnpm build
